name: Check Fedora Backend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/ext-rpm.sh"
      - ".github/workflows/build-rpm-v1.yml"
      - ".github/workflows/check-fedora-backend.yml"
      - "stage/*/fedora/**"
      - "tests/fedora-model.sh"
      - "tests/fedora-snapshot-release.sh"
      - "tests/fedora-rust-vendor.sh"
  push:
    branches:
      - "fedora/**"
    paths:
      - ".github/scripts/ext-rpm.sh"
      - ".github/workflows/build-rpm-v1.yml"
      - ".github/workflows/check-fedora-backend.yml"
      - "stage/*/fedora/**"
      - "tests/fedora-model.sh"
      - "tests/fedora-snapshot-release.sh"
      - "tests/fedora-rust-vendor.sh"

jobs:
  check:
    runs-on: ubuntu-24.04
    # public image: the tests need rpm, GNU sed, spectool and cargo
    container: fedora:43
    steps:
      - name: Install tools
        run: dnf -y install git-core jq rpm-build rpmdevtools cargo xz ShellCheck

      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -x .github/scripts/ext-rpm.sh tests/fedora-model.sh tests/fedora-snapshot-release.sh tests/fedora-rust-vendor.sh

      - name: Check the Fedora package models
        run: tests/fedora-model.sh

      - name: Check snapshot releases
        run: tests/fedora-snapshot-release.sh

      - name: Check Rust vendor tarballs
        run: tests/fedora-rust-vendor.sh
